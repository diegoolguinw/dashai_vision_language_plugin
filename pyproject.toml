[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashai-vision-language-plugin"
version = "0.1.0"
description = "Vision-language zero-shot image classification for dashAI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Diego Olguín-Wende", email = "dolguin@dim.uchile.cl" }]
keywords = ["DashAI", "Model"]
dependencies = [
  "dashAI>=0.9.7.post2",
  "numpy",
  "Pillow",
  "torch",
  "transformers",
]

[project.entry-points.'dashai.plugins']
CLIPViTB32ZeroShotClassifier = "dashai_vision_language_plugin.clip_vit_b32_zero_shot_classifier:CLIPViTB32ZeroShotClassifier"
CLIPViTB16ZeroShotClassifier = "dashai_vision_language_plugin.clip_vit_b16_zero_shot_classifier:CLIPViTB16ZeroShotClassifier"
CLIPViTL14ZeroShotClassifier = "dashai_vision_language_plugin.clip_vit_l14_zero_shot_classifier:CLIPViTL14ZeroShotClassifier"
SigLIPZeroShotClassifier = "dashai_vision_language_plugin.siglip_zero_shot_classifier:SigLIPZeroShotClassifier"
ALIGNZeroShotClassifier = "dashai_vision_language_plugin.align_zero_shot_classifier:ALIGNZeroShotClassifier"
AltCLIPZeroShotClassifier = "dashai_vision_language_plugin.altclip_zero_shot_classifier:AltCLIPZeroShotClassifier"
MetaCLIP2ZeroShotClassifier = "dashai_vision_language_plugin.metaclip2_zero_shot_classifier:MetaCLIP2ZeroShotClassifier"

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/dashai_vision_language_plugin"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: downloads and executes a real Hugging Face checkpoint"]

[tool.ruff]
line-length = 88
target-version = "py310"
